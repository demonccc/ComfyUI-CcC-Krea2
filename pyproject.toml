[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ComfyUI-CcC-Krea2"
version = "0.1.0"
description = "ComfyUI custom nodes for advanced Krea 2 reference-guided editing, including subject, outfit, scene and localized inpainting workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CcC Krea2 Contributors" }
]
license = { text = "GPL-3.0-only" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "pillow>=9.5.0",
    "einops>=0.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Repository = "https://github.com/demonccc/ComfyUI-CcC-Krea2"

[tool.comfy]
PublisherId = "CcC"
DisplayName = "CcC Krea2"
Icon = "🎨"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
