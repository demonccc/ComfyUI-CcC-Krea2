[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ComfyUI-Krea-CcC"
version = "0.1.0"
description = "ComfyUI custom nodes for Krea 2 generation, reference-guided editing, Paint workflows, Vision guidance, LoRA utilities, and text-to-image workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CcC Krea2 Contributors" }
]
license = { text = "GPL-3.0-only" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "pillow>=9.5.0",
    "einops>=0.7.0",
    "safetensors>=0.4.0",
    "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Repository = "https://github.com/demonccc/ComfyUI-Krea-CcC"

[tool.comfy]
PublisherId = "CcC"
DisplayName = "Krea2 CcC"
Icon = "🎨"

[tool.setuptools.packages.find]
include = ["ccc_krea2*"]
exclude = ["tests*", "web*", "workflows*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
