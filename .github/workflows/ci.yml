name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Compile python files
        run: python -m compileall -q ccc_krea2 tests __init__.py

      - name: Run Ruff check
        run: ruff check ccc_krea2 tests __init__.py

      - name: Run Pytest
        run: pytest -q

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    steps:
      - name: Verify matrix status
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "One or more matrix test jobs failed or were cancelled."
            exit 1
          fi
          echo "All matrix test jobs completed successfully."
